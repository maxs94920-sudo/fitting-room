<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c2b0"/>
      <stop offset="100%" stop-color="#a89484"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c221a"/>
      <stop offset="100%" stop-color="#19130f"/>
    </linearGradient>
    <linearGradient id="shoeUpper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="shoeSole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="488" rx="85" ry="8" fill="#000" opacity="0.25"/>

  <!-- Ears -->
  <path d="M 119 50 Q 115 55 119 62 Q 122 55 120 50 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.8"/>
  <path d="M 181 50 Q 185 55 181 62 Q 178 55 180 50 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.8"/>

  <!-- Head Base -->
  <ellipse cx="150" cy="55" rx="30" ry="34" fill="url(#skin)"/>

  <!-- Hair / Hairline -->
  <path d="M 120 45 Q 150 12 180 45 Q 178 30 150 20 Q 122 30 120 45 Z" fill="url(#hair)"/>
  <path d="M 120 45 Q 135 38 150 42 Q 165 38 180 45 Q 172 32 150 28 Q 128 32 120 45 Z" fill="url(#hair)" opacity="0.8"/>

  <!-- Facial Features -->
  <!-- Eyebrows -->
  <path d="M 132 46 Q 138 43 144 47" fill="none" stroke="#4a3b30" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 156 47 Q 162 43 168 46" fill="none" stroke="#4a3b30" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="138" cy="52" rx="4" ry="2.2" fill="#ffffff"/>
  <circle cx="138" cy="52" r="1.8" fill="#3a2f25"/>
  <path d="M 133 51 Q 138 48 143 51" fill="none" stroke="#2c221a" stroke-width="1" stroke-linecap="round"/>

  <ellipse cx="162" cy="52" rx="4" ry="2.2" fill="#ffffff"/>
  <circle cx="162" cy="52" r="1.8" fill="#3a2f25"/>
  <path d="M 157 51 Q 162 48 167 51" fill="none" stroke="#2c221a" stroke-width="1" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 150 52 L 148 62 Q 150 64 152 62" fill="none" stroke="#9e8978" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Lips -->
  <path d="M 143 72 Q 150 70 157 72" fill="none" stroke="#a36e65" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 145 72 Q 150 75 155 72" fill="none" stroke="#a36e65" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Jaw contour shadow -->
  <path d="M 123 60 Q 150 90 177 60" fill="none" stroke="#9e8978" stroke-width="0.8" opacity="0.4"/>

  <!-- Neck -->
  <rect x="143" y="85" width="14" height="22" fill="url(#skin)"/>
  <path d="M 143 85 Q 150 90 157 85" fill="none" stroke="#8c7868" stroke-width="1" opacity="0.5"/>

  <!-- Torso -->
  <path d="M 95 130 Q 150 110 205 130 L 210 250 Q 150 265 90 250 Z" fill="url(#skin)"/>
  <!-- Collarbones -->
  <path d="M 110 118 Q 130 124 146 116" fill="none" stroke="#8c7868" stroke-width="1" opacity="0.5"/>
  <path d="M 154 116 Q 170 124 190 118" fill="none" stroke="#8c7868" stroke-width="1" opacity="0.5"/>

  <!-- Left Arm -->
  <path d="M 95 130 Q 75 135 72 170 L 68 262 Q 68 268 73 268 Q 78 268 80 262 L 88 180 Q 90 150 95 140 Z" fill="url(#skin)"/>

  <!-- Left Hand & Fingers -->
  <g id="left-hand">
    <!-- Hand base/palm -->
    <path d="M 68 262 Q 66 272 69 280 Q 76 282 80 274 Q 81 266 80 262 Z" fill="url(#skin)"/>
    <!-- Fingers -->
    <!-- Thumb -->
    <path d="M 78 264 Q 83 268 82 273 Q 80 275 77 271 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Index finger -->
    <path d="M 75 278 Q 75 288 73 289 Q 71 289 71 280 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Middle finger -->
    <path d="M 72 279 Q 72 291 70 292 Q 68 292 68 280 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Ring finger -->
    <path d="M 69 278 Q 69 289 67 290 Q 65 290 66 278 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Pinky finger -->
    <path d="M 67 275 Q 66 285 64 286 Q 63 286 64 275 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
  </g>

  <!-- Right Arm -->
  <path d="M 205 130 Q 225 135 228 170 L 232 262 Q 232 268 227 268 Q 222 268 220 262 L 212 180 Q 210 150 205 140 Z" fill="url(#skin)"/>

  <!-- Right Hand & Fingers -->
  <g id="right-hand">
    <!-- Hand base/palm -->
    <path d="M 232 262 Q 234 272 231 280 Q 224 282 220 274 Q 219 266 220 262 Z" fill="url(#skin)"/>
    <!-- Fingers -->
    <!-- Thumb -->
    <path d="M 222 264 Q 217 268 218 273 Q 220 275 223 271 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Index finger -->
    <path d="M 225 278 Q 225 288 227 289 Q 229 289 229 280 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Middle finger -->
    <path d="M 228 279 Q 228 291 230 292 Q 232 292 232 280 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Ring finger -->
    <path d="M 231 278 Q 231 289 233 290 Q 235 290 234 278 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
    <!-- Pinky finger -->
    <path d="M 233 275 Q 234 285 236 286 Q 237 286 236 275 Z" fill="url(#skin)" stroke="#8c7868" stroke-width="0.5"/>
  </g>

  <!-- Pants / Legs -->
  <path d="M 95 260 L 88 468 L 135 468 L 148 340 L 152 340 L 165 468 L 212 468 L 205 260 Z" fill="#323232"/>
  <!-- Pant seam/crease details -->
  <line x1="112" y1="265" x2="111" y2="465" stroke="#242424" stroke-width="1.5"/>
  <line x1="188" y1="265" x2="189" y2="465" stroke="#242424" stroke-width="1.5"/>

  <!-- Shoes -->
  <!-- Left Shoe -->
  <g id="left-shoe">
    <!-- Main Shoe Upper -->
    <path d="M 88 465 Q 80 472 80 484 Q 85 487 132 487 Q 135 482 135 465 Z" fill="url(#shoeUpper)"/>
    <!-- Shoe Tongue/Collar -->
    <path d="M 88 465 Q 110 462 135 465 Q 132 472 88 472 Z" fill="#3d3d3d"/>
    <!-- Laces / Details -->
    <line x1="100" y1="471" x2="118" y2="471" stroke="#888888" stroke-width="1"/>
    <line x1="102" y1="474" x2="120" y2="474" stroke="#888888" stroke-width="1"/>
    <line x1="104" y1="477" x2="122" y2="477" stroke="#888888" stroke-width="1"/>
    <!-- Sole / Midsole -->
    <path d="M 78 484 Q 78 489 83 489 L 134 489 Q 137 489 136 484 Z" fill="url(#shoeSole)"/>
    <!-- Bottom tread line -->
    <line x1="80" y1="488" x2="135" y2="488" stroke="#666666" stroke-width="1"/>
  </g>

  <!-- Right Shoe -->
  <g id="right-shoe">
    <!-- Main Shoe Upper -->
    <path d="M 212 465 Q 220 472 220 484 Q 215 487 168 487 Q 165 482 165 465 Z" fill="url(#shoeUpper)"/>
    <!-- Shoe Tongue/Collar -->
    <path d="M 212 465 Q 190 462 165 465 Q 168 472 212 472 Z" fill="#3d3d3d"/>
    <!-- Laces / Details -->
    <line x1="200" y1="471" x2="182" y2="471" stroke="#888888" stroke-width="1"/>
    <line x1="198" y1="474" x2="180" y2="474" stroke="#888888" stroke-width="1"/>
    <line x1="196" y1="477" x2="178" y2="477" stroke="#888888" stroke-width="1"/>
    <!-- Sole / Midsole -->
    <path d="M 222 484 Q 222 489 217 489 L 166 489 Q 163 489 164 484 Z" fill="url(#shoeSole)"/>
    <!-- Bottom tread line -->
    <line x1="220" y1="488" x2="165" y2="488" stroke="#666666" stroke-width="1"/>
  </g>
</svg>
